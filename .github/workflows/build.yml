name: Build BoxAverageTracker.exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      # permet aussi de lancer la compilation manuellement depuis l'onglet Actions

permissions:
  contents: write        # nécessaire pour pouvoir créer/mettre à jour une Release

jobs:
  build:
    runs-on: windows-latest   # WPF .NET Framework ne peut être compilé que sur Windows

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurer NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurer les packages NuGet
        run: nuget restore BoxAverageTracker.sln

      - name: Tamponner le numéro de build (sert à la mise à jour automatique)
        shell: pwsh
        run: |
          $n = "${{ github.run_number }}"
          $f = "Properties/AssemblyInfo.cs"
          (Get-Content $f) `
            -replace 'AssemblyVersion\("1\.0\.0\.0"\)', "AssemblyVersion(`"2.0.$n.0`")" `
            -replace 'AssemblyFileVersion\("1\.0\.0\.0"\)', "AssemblyFileVersion(`"2.0.$n.0`")" |
            Set-Content $f -Encoding utf8
          Set-Content -Path version.txt -Value $n -NoNewline -Encoding ascii
          Select-String -Path $f -Pattern 'AssemblyVersion|AssemblyFileVersion'

      - name: Compiler l'application (Release)
        run: msbuild BoxAverageTracker.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Mettre le .exe à disposition en téléchargement (artifact interne)
        uses: actions/upload-artifact@v4
        with:
          name: BoxAverageTracker-windows
          path: bin/Release/BoxAverageTracker.exe

      - name: Publier/mettre à jour la Release publique "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dernière version"
          body: "Compilation automatique la plus récente (build ${{ github.run_number }}). Lien direct ci-dessous. L'appli se met à jour toute seule à partir de cette version."
          files: |
            bin/Release/BoxAverageTracker.exe
            version.txt
